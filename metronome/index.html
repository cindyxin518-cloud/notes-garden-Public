<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cadence Metronome - 步频节拍器</title>
  <meta name="theme-color" content="#070B12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css?v=20260830-clean">
</head>
<body>
  <div class="app-container">
    <!-- 顶部状态栏与导航 -->
    <header class="app-header">
      <div class="brand-group">
        <div class="brand-icon">🏃</div>
        <div class="brand-text">
          <h1 id="appTitle">Cadence Metronome</h1>
          <p id="appSubtitle">Background Audio Mixer</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="langToggleBtn" class="lang-btn">🇨🇳 中文</button>
        <div id="statusBadge" class="status-badge">Ready</div>
      </div>
    </header>

    <main class="main-content">
      <!-- 核心节拍器卡片 -->
      <section class="card metronome-card">
        <!-- 左右脚指示器 -->
        <div class="foot-indicator-row">
          <div id="leftFoot" class="foot-pill">LEFT (L)</div>
          <div id="rightFoot" class="foot-pill">RIGHT (R)</div>
        </div>

        <!-- 步频大圆盘 (绝对居中) -->
        <div id="spmCircle" class="spm-circle-wrapper" title="点击播放/暂停">
          <div class="spm-circle-inner">
            <span id="spmDisplay" class="spm-num">180</span>
            <span id="spmUnit" class="spm-unit">SPM CADENCE</span>
          </div>
        </div>

        <!-- 步频加减微调按钮 -->
        <div class="adjust-btn-row">
          <button class="adj-btn" data-step="-5">-5</button>
          <button class="adj-btn" data-step="-1">-1</button>
          <button class="adj-btn" data-step="1">+1</button>
          <button class="adj-btn" data-step="5">+5</button>
        </div>

        <!-- 步频滑动条 -->
        <div class="slider-row">
          <input type="range" id="spmSlider" min="120" max="240" step="1" value="180" class="yellow-slider">
        </div>

        <!-- 预设步频档位 -->
        <div class="presets-row">
          <button class="preset-btn" data-spm="160">160</button>
          <button class="preset-btn" data-spm="170">170</button>
          <button class="preset-btn" data-spm="175">175</button>
          <button class="preset-btn active" data-spm="180">180</button>
          <button class="preset-btn" data-spm="190">190</button>
        </div>

        <!-- 开始/暂停大按键 -->
        <button id="playBtn" class="play-btn">
          <span id="playIcon">▶</span>
          <span id="playText">START (180 SPM)</span>
        </button>

        <!-- 运动统计 -->
        <div class="stats-row">
          <div class="stat-col">
            <span id="workoutDuration" class="stat-val">00:00</span>
            <span id="durationLabel" class="stat-lbl">Duration</span>
          </div>
          <div class="stat-col">
            <span id="workoutSteps" class="stat-val">0</span>
            <span id="stepsLabel" class="stat-lbl">Total Steps</span>
          </div>
        </div>
      </section>

      <!-- 音色与音量卡片 -->
      <section class="card sound-card">
        <h2 id="soundHeaderTitle" class="card-title">🔊 Sound & Volume</h2>
        
        <!-- 音色切换 -->
        <div class="sound-tabs-scroll">
          <button class="sound-chip active" data-sound="woodblock">🪵 Woodblock</button>
          <button class="sound-chip" data-sound="dualtone">👟 Dual-Tone</button>
          <button class="sound-chip" data-sound="click">⏱️ Mechanical</button>
          <button class="sound-chip" data-sound="beep">⚡ Electronic</button>
          <button class="sound-chip" data-sound="cowbell">🔔 Cowbell</button>
        </div>

        <!-- 音量滑动条 -->
        <div class="volume-section">
          <div class="volume-header">
            <span id="volumeLabel">Volume: 80%</span>
          </div>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8" class="yellow-slider">
        </div>

        <!-- 振动反馈开关 -->
        <label class="vibrate-row">
          <input type="checkbox" id="vibrateToggle" class="vibrate-cb">
          <span id="vibrateLabel">Haptic Beat Vibration</span>
        </label>
      </section>
    </main>
  </div>

  <script src="js/audio.js?v=20260830-clean"></script>
  <script src="js/app.js?v=20260830-clean"></script>
</body>
</html>
